<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F6F7F9" />
    <meta name="description" content="Portfolio Manager: облік інвестиційних портфелів та оптимізація за Марковіцем" />
    <title>Portfolio Manager</title>
    <style>
      /* The page colour before the app has started, so a dark theme does not flash white. */
      html { background: #F6F7F9; }
      html[data-theme='dark'] { background: #0C0E12; }
    </style>
    <script>
      (function () {
        var stored = null;
        try { stored = window.localStorage.getItem('portfolioManager.themeMode'); } catch (e) { /* storage blocked */ }
        var systemDark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var dark = stored === 'dark' || (stored !== 'light' && systemDark);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <noscript>Для роботи застосунку потрібно увімкнути JavaScript.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
