# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Once the CodeRabbit GitHub App is installed on this repository, every pull request into master gets:
#   - a review: a summary, line comments, and answers when you reply to it or mention @coderabbitai;
#   - its code-quality and security tools on the changed files, all on by default and needing no setup here
#     (ruff, flake8, pylint, eslint, hadolint, actionlint, yamllint, gitleaks, trufflehog, osv-scanner, semgrep, trivy,
#     checkov and others; there is no C# linter among them, so CI keeps building the .NET code with warnings as errors);
#   - a `CodeRabbit` check on the pull request, next to the CI jobs.
# It is an app, not a pipeline step: nothing in .github/workflows needs to change. Reference:
# https://docs.coderabbit.ai/reference/configuration. On a pull request, comment `@coderabbitai configuration` to see
# the settings it actually used.
language: en-US

reviews:
  # chill: the findings that matter, not style nits.
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  in_progress_fortune: false
  # One-person repository: nobody to suggest or assign.
  suggested_reviewers: false
  auto_assign_reviewers: false

  auto_review:
    enabled: true
    drafts: false

  path_filters:
    # Generated by tools; the migrations themselves (not these) are reviewed, they change real data.
    - "!**/Migrations/*.Designer.cs"
    - "!**/Migrations/*ModelSnapshot.cs"
    - "!**/package-lock.json"
    - "!**/dist/**"
    - "!**/*.cd"
    - "!PortfolioManager/PortfolioManager.API/Properties/ServiceDependencies/**"
    - "!docs/screenshots/**"

  path_instructions:
    - path: "PortfolioManager/PortfolioManager.{API,BLL,DAL,Common}/**"
      instructions: |
        ASP.NET Core 8 API, layered API -> BLL -> DAL -> Common. Rules this codebase keeps (see PortfolioManager/README.md, "API rules"):
        - The user id comes from the access token, never from the request. Every portfolio, position and statistics
          query is scoped to the owner in the SQL WHERE (GetOwnedAsync / FindOwnedAsync / IsOwnedByAsync); a record of
          another user answers 404, like one that does not exist. Flag any lookup by id alone.
        - Money is decimal (decimal(18,4) in SQL). Flag float or double for money.
        - Pass the request's CancellationToken to EF Core and to IMathModuleClient.
        - Errors are typed exceptions mapped by PortfolioManagerExceptionFilter; a 500 must not leak a message or stack
          trace outside Development.
        - A new EF migration must match the model snapshot and say in its Up/Down what data it drops or rewrites.
    - path: "PortfolioManager/PortfolioManager.Tests/**"
      instructions: |
        Tests must not need SQL Server, Yahoo Finance or the Python service: the API tests start Program over EF Core's
        in-memory database and a fake math module.
    - path: "PortfolioManager/PortfolioManager.MathModule/**"
      instructions: |
        Python 3.12 FastAPI service. No test may reach the network (pytest runs with --disable-socket, and
        tests/conftest.py blocks yfinance's own HTTP client); Yahoo Finance must never be called from a test.
        Only app/providers.py talks to Yahoo; the maths modules take DataFrames and return plain values.
        Dependencies are pinned in requirements*.txt. The service must fail closed: REQUIRE_API_KEY refuses to start without
        MATH_API_KEY, and error bodies never carry a traceback.
    - path: "PortfolioManager/PortfolioManager.Client/**"
      instructions: |
        React + TypeScript + Vite. The UI text is Ukrainian on purpose: do not suggest translating it.
        The API's metrics are keyed by metricKey; calls go through src/Services.
    - path: "infra/**"
      instructions: |
        Bicep for the private hosting of the Python math service. It must stay unreachable from the internet (internal
        Container Apps environment, API key as a second lock). Flag public exposure, secrets in plain text or in outputs,
        and permissions wider than needed. The existing API site is deliberately not managed here.
    - path: ".github/workflows/**"
      instructions: |
        No secrets in the repository; a workflow that ever signs in to Azure must use OpenID Connect (azure/login), not a
        stored password. Flag broad `permissions`, untrusted input (PR title, branch name, issue text) used directly in
        a `run:` step, and unpinned third-party actions.

  tools:
    # The READMEs are prose; markdown style findings are noise here.
    markdownlint:
      enabled: false

chat:
  auto_reply: true
